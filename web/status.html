<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirror Hub 状态页</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; color: #111827; }
      h1 { margin-bottom: .5rem; }
      .item { border: 1px solid #e5e7eb; border-radius: 8px; padding: .9rem 1rem; margin: .75rem 0; }
      .ok { color: #166534; }
      .bad { color: #b91c1c; }
      button { padding: .45rem .9rem; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
      code { background: #f3f4f6; padding: .1rem .35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Mirror Hub 服务状态</h1>
    <p>状态数据由前端实时探测 <code>/api/healthz</code> 与 <code>/api/help</code>。</p>
    <button id="refresh">刷新状态</button>
    <div id="status"></div>

    <script>
      const checks = [
        {
          name: 'crproxy 健康检查',
          url: '/api/healthz',
          validate: (status, text) => status === 200 && text.includes('ok')
        },
        {
          name: '镜像路由表',
          url: '/api/help',
          validate: (status, text) => status === 200 && text.includes('{')
        }
      ];

      async function runChecks() {
        const root = document.getElementById('status');
        root.innerHTML = '';

        for (const check of checks) {
          const start = performance.now();
          let ok = false;
          let status = 0;
          let detail = '';

          try {
            const res = await fetch(check.url, { cache: 'no-store' });
            const text = await res.text();
            status = res.status;
            ok = check.validate(status, text);
            detail = text.slice(0, 140).replace(/\n/g, ' ');
          } catch (error) {
            detail = String(error);
          }

          const ms = Math.round(performance.now() - start);
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `
            <strong>${check.name}</strong><br />
            目标：<code>${check.url}</code><br />
            结果：<span class="${ok ? 'ok' : 'bad'}">${ok ? '正常' : '异常'}</span><br />
            HTTP: <code>${status || 'N/A'}</code>，耗时：<code>${ms} ms</code><br />
            详情：<code>${detail || '-'}</code>
          `;
          root.appendChild(div);
        }
      }

      document.getElementById('refresh').addEventListener('click', runChecks);
      runChecks();
    </script>
  </body>
</html>
