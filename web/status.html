<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mirror Hub 状态页</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem auto; max-width: 900px; padding: 0 1rem; color: #111827; }
      h1 { margin-bottom: .5rem; }
      .item { border: 1px solid #e5e7eb; border-radius: 8px; padding: .9rem 1rem; margin: .75rem 0; }
      .ok { color: #166534; }
      .bad { color: #b91c1c; }
      button { padding: .45rem .9rem; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; }
      code { background: #f3f4f6; padding: .1rem .35rem; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Mirror Hub 服务状态</h1>
    <p>状态数据由前端实时探测 <code>/api/healthz</code> 与 <code>/api/help</code>。</p>
    <button id="refresh">刷新状态</button>
    <div id="status"></div>

    <script>
      const MAX_DETAIL_CHARS = 140;
      const sanitizeText = (value) => String(value ?? '').replace(/\u0000/g, '');
      const checks = [
        {
          name: 'crproxy 健康检查',
          url: '/api/healthz',
          validate: (status, text) => status === 200 && text.includes('ok')
        },
        {
          name: '镜像路由表',
          url: '/api/help',
          validate: (status, text) => status === 200 && text.includes('{')
        }
      ];

      async function runChecks() {
        const root = document.getElementById('status');
        root.innerHTML = '';

        for (const check of checks) {
          const start = performance.now();
          let ok = false;
          let status = 0;
          let detail = '';

          try {
            const res = await fetch(check.url, { cache: 'no-store' });
            const text = await res.text();
            status = res.status;
            ok = check.validate(status, text);
            detail = sanitizeText(text).slice(0, MAX_DETAIL_CHARS).replace(/\n/g, ' ');
          } catch (error) {
            detail = sanitizeText(error);
          }

          const ms = Math.round(performance.now() - start);
          const div = document.createElement('div');
          div.className = 'item';
          const title = document.createElement('strong');
          title.textContent = check.name;

          const target = document.createElement('p');
          target.textContent = `目标：${check.url}`;

          const result = document.createElement('p');
          const resultText = document.createElement('span');
          resultText.className = ok ? 'ok' : 'bad';
          resultText.textContent = ok ? '正常' : '异常';
          result.textContent = '结果：';
          result.appendChild(resultText);

          const metrics = document.createElement('p');
          metrics.textContent = `HTTP: ${status || 'N/A'}，耗时：${ms} ms`;

          const detailLine = document.createElement('p');
          detailLine.textContent = `详情：${detail || '-'}`;

          div.appendChild(title);
          div.appendChild(target);
          div.appendChild(result);
          div.appendChild(metrics);
          div.appendChild(detailLine);
          root.appendChild(div);
        }
      }

      document.getElementById('refresh').addEventListener('click', runChecks);
      runChecks();
    </script>
  </body>
</html>
