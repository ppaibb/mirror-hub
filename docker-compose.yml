version: '3.4'

services:
  # Path-style multi-registry entry:
  #   cr.example.com/docker.io/library/nginx:latest
  #   cr.example.com/ghcr.io/owner/image:tag
  #   cr.example.com/quay.io/org/image:tag
  crproxy-path:
    image: ghcr.io/daocloud/crproxy/crproxy:v0.9.1
    container_name: crproxy-path
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"

  # Docker Hub-only mirror entry:
  #   dhub.example.com/library/nginx:latest
  #   Docker daemon registry mirror: https://dhub.example.com
  crproxy-dhub:
    image: ghcr.io/daocloud/crproxy/crproxy:v0.9.1
    container_name: crproxy-dhub
    restart: unless-stopped
    ports:
      - "127.0.0.1:18081:8080"
    command: |
      --default-registry=docker.io
